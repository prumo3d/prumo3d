# Prumo 3D: gera os pacotes para Windows e Linux e publica na página de versões.
#
# - Ao enviar uma tag "v*" (ex.: v0.1.0-beta): compila Windows e Linux nas máquinas do GitHub
#   (gratuitas em repositório público), empacota e cria a versão na página de versões. Tag com
#   hífen (beta, rc) sai marcada como pré-lançamento.
# - Manualmente (Actions → "Publicar versão" → Run workflow, no ramo main):
#     * com "versao" preenchida (ex.: 0.1.2-beta): compila, empacota, cria a tag v<versao> no commit
#       e publica. É o caminho recomendado: guarda o cache de compilação para as próximas versões.
#     * sem "versao": só compila e empacota; os arquivos ficam como artefatos por 3 dias.
# - Cache de compilação (ccache): o cache das execuções no main é guardado e reaproveitado pelas
#   próximas (inclusive pelas de tag, que só leem: o GitHub isola o cache gravado numa tag). Só o C++
#   que mudou é recompilado.
# - O fluxo não roda em pull requests. O repositório é público e não tem runner próprio (o runner
#   do computador de desenvolvimento foi removido em 21/10/2026): tudo roda nas máquinas do GitHub.
#   Os passos para computador próprio (runner.environment != 'github-hosted') ficaram para o caso de
#   um runner voltar a ser registrado.
#
# Formatos:
#   Windows: instalador (.exe) e versão portátil (.7z)
#   Linux:   AppImage (arquivo único, roda sem instalar)
#
# Baseado no fluxo de publicação do FreeCAD (rattler-build + pixi).

name: Publicar versão

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão a publicar (ex.: 0.1.2-beta). Vazio = só compilar, sem publicar"
        required: false
        default: ""
      rotulo:
        description: "Rótulo dos arquivos (ex.: teste)"
        required: false
        default: "teste"
      maquina:
        description: "Onde compilar (só as máquinas do GitHub; o runner próprio foi removido)"
        type: choice
        options: [github]
        default: github
      plataformas:
        description: "Quais pacotes"
        type: choice
        options: [ambas, win-64, linux-64]
        default: ambas

permissions:
  contents: write

concurrency:
  group: publicar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  planejar:
    name: Planejar
    runs-on: ${{ (github.event.inputs.maquina || 'github') == 'pc' && fromJSON('["self-hosted","prumo","Windows"]') || 'ubuntu-latest' }}
    outputs:
      matriz: ${{ steps.m.outputs.matriz }}
    steps:
      - name: Git Bash no caminho (Windows, computador próprio)
        if: runner.os == 'Windows' && runner.environment != 'github-hosted'
        shell: cmd   # o cmd não depende da política de execução de scripts do PowerShell
        run: echo C:\Program Files\Git\bin>>"%GITHUB_PATH%"

      - id: m
        shell: bash
        run: |
          maquina="${{ github.event.inputs.maquina || 'github' }}"
          plat="${{ github.event.inputs.plataformas || 'ambas' }}"
          if [ "$maquina" = "pc" ]; then
            lin='["self-hosted","prumo","Linux"]'; win='["self-hosted","prumo","Windows"]'
          else
            lin='"ubuntu-22.04"'; win='"windows-2022"'
          fi
          itens=()
          if [ "$plat" = "linux-64" ] || [ "$plat" = "ambas" ]; then
            itens+=("{\"target\":\"linux-64\",\"pasta\":\"linux\",\"maquina\":$lin}")
          fi
          if [ "$plat" = "win-64" ] || [ "$plat" = "ambas" ]; then
            itens+=("{\"target\":\"win-64\",\"pasta\":\"windows\",\"maquina\":$win}")
          fi
          matriz="{\"include\":[$(IFS=,; echo "${itens[*]}")]}"
          echo "matriz=$matriz" >> "$GITHUB_OUTPUT"
          echo "Matriz: $matriz"

  pacotes:
    name: Pacote ${{ matrix.target }}
    needs: planejar
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.planejar.outputs.matriz) }}
    runs-on: ${{ matrix.maquina }}
    timeout-minutes: 600

    steps:
      # o "bash" do System32 é o do WSL; os passos precisam do Git Bash
      - name: Git Bash no caminho (Windows, computador próprio)
        if: runner.os == 'Windows' && runner.environment != 'github-hosted'
        shell: cmd   # o cmd não depende da política de execução de scripts do PowerShell
        run: echo C:\Program Files\Git\bin>>"%GITHUB_PATH%"

      - name: Liberar espaço em disco (Linux, máquina do GitHub)
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        uses: AdityaGarg8/remove-unwanted-software@90e01b21170618765a73370fcc3abbd1684a7793 # v5
        with:
          verbose: "true"
          remove-android: "true"
          remove-cached-tools: "true"

      - name: Cache do pixi no disco D (Windows, máquina do GitHub)
        if: runner.os == 'Windows' && runner.environment == 'github-hosted'
        shell: bash
        run: |
          echo 'PIXI_CACHE_DIR=D:\rattler' >> "$GITHUB_ENV"
          echo 'RATTLER_CACHE_DIR=D:\rattler' >> "$GITHUB_ENV"

      - name: Baixar o código
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          submodules: "recursive"
          # no computador próprio, mantém o ambiente do pixi entre execuções (bem mais rápido);
          # os arquivos do repositório são restaurados mesmo assim
          clean: ${{ runner.environment == 'github-hosted' }}

      - uses: prefix-dev/setup-pixi@82d477f15f3a381dbcc8adc1206ce643fe110fb7 # v0.9.3
        with:
          pixi-version: v0.59.0
          cache: false
          run-install: false
          # pixi próprio do fluxo, numa pasta temporária: não mexe no pixi já instalado no computador
          pixi-bin-path: ${{ runner.temp }}/pixi/bin/pixi${{ runner.os == 'Windows' && '.exe' || '' }}

      - name: Definir o rótulo da versão
        shell: bash
        env:
          VERSAO: ${{ github.event.inputs.versao }}
        run: |
          versao="${VERSAO}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            BUILD_TAG="${GITHUB_REF_NAME#v}"
          elif [[ -n "${versao}" ]]; then
            BUILD_TAG="${versao#v}"
          else
            BUILD_TAG="${{ github.event.inputs.rotulo || 'teste' }}-${GITHUB_RUN_NUMBER}"
          fi
          echo "BUILD_TAG=${BUILD_TAG}" >> "$GITHUB_ENV"
          echo "Rótulo: ${BUILD_TAG}"

      # a versão do pacote vale para a tela de abertura (selo), o título da janela e o Sobre
      - name: Versão na tela de abertura
        shell: bash
        run: |
          set -euo pipefail
          printf 'VERSAO_COMPILADA = "%s"\n' "${BUILD_TAG}" > src/Mod/Prumo3D/PrumoVersaoCompilada.py
          pixi exec --spec "python=3.11" --spec "pillow" python prumo-build/ferramentas/selo_versao_splash.py "${BUILD_TAG}"

      # pasta fixa do ccache; o caminho vai num arquivo na raiz do código, que os roteiros de
      # compilação (build.sh / build.bat) leem
      - name: Pasta do cache de compilação
        shell: bash
        run: |
          if [ "${RUNNER_OS}" = "Windows" ]; then d='D:\ccache'; else d="${HOME}/ccache"; fi
          echo "PRUMO_CCACHE_DIR=${d}" >> "$GITHUB_ENV"
          printf '%s' "${d}" > prumo_ccache_dir.txt

      - name: Restaurar o cache de compilação
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.PRUMO_CCACHE_DIR }}
          key: ccache-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: ccache-${{ matrix.target }}-

      - name: Compilar (rattler-build)
        id: compilar
        shell: bash
        run: |
          set -euo pipefail
          # Python do próprio pixi: o computador próprio não precisa ter Python instalado
          pixi exec --spec "python=3.11" python package/scripts/write_version_info.py ../prumo3d_version.txt
          cd package/rattler-build
          # restos de execuções anteriores (computador próprio): só os arquivos gerados — a pasta
          # também guarda os roteiros de empacotamento, que são do repositório
          git clean -ffdxq -- "${{ matrix.pasta }}"
          pixi install

      # grava mesmo se a compilação falhar depois de ter compilado boa parte; só no main (o cache
      # gravado numa tag fica preso a ela e ocuparia a cota à toa)
      - name: Guardar o cache de compilação
        if: always() && github.ref == 'refs/heads/main' && steps.compilar.outcome != 'skipped'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.PRUMO_CCACHE_DIR }}
          key: ccache-${{ matrix.target }}-${{ github.run_id }}

      - name: Empacotar
        shell: bash
        env:
          MAKE_INSTALLER: "true"
          UPLOAD_RELEASE: "false"
          WINDOWS_SIGN_RELEASE: "0"
          TARGET_PLATFORM: ${{ matrix.target }}
          # no computador próprio, o 7-Zip do ambiente pixi falha (código 2): só o instalador
          PRUMO_SEM_7Z: ${{ runner.environment != 'github-hosted' && '1' || '0' }}
        run: |
          set -euo pipefail
          cd package/rattler-build
          pixi run -e package create_bundle
          ls -la ${{ matrix.pasta }}

      - name: Guardar no computador próprio
        if: runner.environment != 'github-hosted'
        shell: bash
        run: |
          set -euo pipefail
          destino="${PRUMO_PACOTES:-$HOME/Prumo3D-pacotes}/${BUILD_TAG}"
          mkdir -p "$destino"
          # só os arquivos (instalador, .7z, AppImage, somas); a pasta montada fica no runner
          find package/rattler-build/${{ matrix.pasta }} -maxdepth 1 -type f -name 'Prumo3D_*' \
            -exec cp -v {} "$destino"/ \;
          ls "$destino"/Prumo3D_* >/dev/null 2>&1 || { echo "nenhum pacote gerado"; exit 1; }
          echo "Pacotes em: $destino"
          echo "### Pacotes em \`$destino\`" >> "$GITHUB_STEP_SUMMARY"
          ls -la "$destino" >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar os arquivos (máquina do GitHub)
        if: runner.environment == 'github-hosted'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: prumo3d-${{ matrix.target }}
          if-no-files-found: error
          # o plano gratuito inclui pouco armazenamento para artefatos; a versão publicada fica
          # na página de versões, então os artefatos da execução expiram logo
          retention-days: 3
          path: |
            package/rattler-build/${{ matrix.pasta }}/Prumo3D_*.exe
            package/rattler-build/${{ matrix.pasta }}/Prumo3D_*.7z
            package/rattler-build/${{ matrix.pasta }}/Prumo3D_*.AppImage
            package/rattler-build/${{ matrix.pasta }}/Prumo3D_*-SHA256.txt

  publicar:
    name: Publicar na página de versões
    needs: pacotes
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event.inputs.versao != '')
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Juntar os arquivos
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: arquivos
          merge-multiple: true

      - name: Criar a versão
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO: ${{ github.event.inputs.versao }}
        run: |
          set -euo pipefail
          ls -la arquivos
          extra=()
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
            extra+=(--verify-tag)          # a tag já existe (foi ela que disparou)
          else
            tag="v${VERSAO#v}"
            extra+=(--target "${GITHUB_SHA}")   # cria a tag no commit compilado
          fi
          # novidades da versão (NOVIDADES.md) + parte fixa (como baixar, como relatar problema)
          notas="$(mktemp)"
          python3 package/scripts/notas_da_versao.py "${tag}" > "${notas}"
          if [[ "${tag}" == *-* ]]; then
            extra+=(--prerelease)          # v0.1.0-beta, v1.0.0-rc1...
          fi
          gh release create "${tag}" arquivos/* \
            --title "Prumo 3D ${tag#v}" \
            --notes-file "${notas}" \
            "${extra[@]}"
